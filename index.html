<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07C160">
  <title>微信扫码付定金</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 28px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 340px;
      width: 90%;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #07C160;
    }
    .logo svg { width: 32px; height: 32px; }
    .logo span { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    .title {
      font-size: 17px;
      font-weight: 600;
      color: #222;
      text-align: center;
    }
    .subtitle {
      font-size: 13px;
      color: #888;
      text-align: center;
      margin-top: -12px;
    }
    .qr-wrap {
      border: 3px solid #07C160;
      border-radius: 16px;
      padding: 10px;
      background: #fff;
    }
    .qr-wrap img {
      display: block;
      width: 220px;
      height: 220px;
      object-fit: contain;
      border-radius: 8px;
    }
    .save-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 12px;
      background: #07C160;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .save-btn:active { background: #059a4d; }
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .overlay.show { display: flex; }
    .overlay img {
      width: min(80vw, 320px);
      height: min(80vw, 320px);
      object-fit: contain;
      border-radius: 12px;
      border: 3px solid #fff;
    }
    .overlay-tip {
      color: #fff;
      font-size: 15px;
      text-align: center;
      line-height: 1.6;
    }
    .overlay-tip span { color: #07C160; font-weight: 700; }
    .overlay-close {
      margin-top: 4px;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
    }
    .tip {
      font-size: 13px;
      color: #07C160;
      background: #e8f8ee;
      border-radius: 8px;
      padding: 8px 16px;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
